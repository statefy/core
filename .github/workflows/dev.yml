name: Dev Build

on:
  push:
    branches:
      - dev

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: dev-build
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/core

jobs:
  build-native-linux:
    name: Build native CLI (linux-x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build native artifacts
        run: |
          build_dir="build/linux-x64"
          install_dir="$build_dir/install"
          dist_dir="dist/linux-x64"
          bash scripts/build-native.sh "$dist_dir" "$build_dir" "$install_dir"

      - name: Run native tests
        run: ctest --test-dir "build/linux-x64" --build-config Release --output-on-failure

      - name: Run CLI smoke check
        run: bash scripts/smoke-native.sh "dist/linux-x64/core"

      - name: Package native artifacts
        run: |
          bash scripts/package-native-artifacts.sh \
            "linux-x64" \
            "dist/linux-x64" \
            "build/linux-x64/install" \
            "dist/artifacts/linux-x64"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-x64
          path: dist/artifacts/linux-x64/*
          if-no-files-found: error

  build-native-windows:
    name: Build native CLI (windows-x64)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native artifacts
        run: |
          build_dir="build/windows-x64"
          install_dir="$build_dir/install"
          dist_dir="dist/windows-x64"
          bash scripts/build-native.sh "$dist_dir" "$build_dir" "$install_dir"

      - name: Run native tests
        run: ctest --test-dir "build/windows-x64" --build-config Release --output-on-failure

      - name: Run CLI smoke check
        run: bash scripts/smoke-native.sh "dist/windows-x64/core.exe"

      - name: Package native artifacts
        run: |
          bash scripts/package-native-artifacts.sh \
            "windows-x64" \
            "dist/windows-x64" \
            "build/windows-x64/install" \
            "dist/artifacts/windows-x64"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-windows-x64
          path: dist/artifacts/windows-x64/*
          if-no-files-found: error

  build-native-macos:
    name: Build native CLI (macos-x64)
    runs-on: macos-13

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native artifacts
        run: |
          build_dir="build/macos-x64"
          install_dir="$build_dir/install"
          dist_dir="dist/macos-x64"
          bash scripts/build-native.sh "$dist_dir" "$build_dir" "$install_dir"

      - name: Run native tests
        run: ctest --test-dir "build/macos-x64" --build-config Release --output-on-failure

      - name: Run CLI smoke check
        run: bash scripts/smoke-native.sh "dist/macos-x64/core"

      - name: Package native artifacts
        run: |
          bash scripts/package-native-artifacts.sh \
            "macos-x64" \
            "dist/macos-x64" \
            "build/macos-x64/install" \
            "dist/artifacts/macos-x64"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-macos-x64
          path: dist/artifacts/macos-x64/*
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM bundle
        run: bash scripts/build-wasm.sh dist/wasm

      - name: Run WASM smoke check
        run: bash scripts/smoke-wasm.sh dist/wasm/core_wasm.js dist/wasm/core_wasm.wasm

      - name: Package WASM bundle
        run: tar -C dist/wasm -czf dist/core-wasm.tar.gz core_wasm.js core_wasm.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: dist/core-wasm.tar.gz
          if-no-files-found: error

  publish-image:
    name: Publish dev image
    runs-on: ubuntu-22.04
    needs:
      - build-native-linux
      - build-wasm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push dev image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Prepare image SBOM output path
        run: mkdir -p dist

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build_image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/core-image-sbom.spdx.json
          artifact-name: core-image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-image-sbom
          path: dist/core-image-sbom.spdx.json
          if-no-files-found: error

      - name: Generate container provenance attestation
        if: ${{ !github.event.repository.private || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_image.outputs.digest }}
          push-to-registry: true

      - name: Generate container SBOM attestation
        if: ${{ !github.event.repository.private || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_image.outputs.digest }}
          sbom-path: dist/core-image-sbom.spdx.json
          push-to-registry: true
