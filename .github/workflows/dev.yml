name: Dev Build

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/core

jobs:
  build-native:
    name: Build native CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build native binary
        run: bash scripts/build-native.sh dist/linux

      - name: Package native binary
        run: tar -C dist/linux -czf dist/core-linux-x64.tar.gz core

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-x64
          path: dist/core-linux-x64.tar.gz
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM bundle
        run: bash scripts/build-wasm.sh dist/wasm

      - name: Package WASM bundle
        run: tar -C dist/wasm -czf dist/core-wasm.tar.gz core_wasm.js core_wasm.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: dist/core-wasm.tar.gz
          if-no-files-found: error

  publish-image:
    name: Publish dev image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
