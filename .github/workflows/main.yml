name: Main Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: main-release
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/core

jobs:
  build-native:
    name: Build native CLI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build native binary
        run: bash scripts/build-native.sh dist/linux

      - name: Package native binary
        run: tar -C dist/linux -czf dist/core-linux-x64.tar.gz core

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-x64
          path: dist/core-linux-x64.tar.gz
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM bundle
        run: bash scripts/build-wasm.sh dist/wasm

      - name: Package WASM bundle
        run: tar -C dist/wasm -czf dist/core-wasm.tar.gz core_wasm.js core_wasm.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: dist/core-wasm.tar.gz
          if-no-files-found: error

  publish-image:
    name: Publish latest image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-native
      - build-wasm
      - publish-image

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        run: |
          tag="main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          find release-assets -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > release-assets/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were produced." >&2
            exit 1
          fi
          gh release create "${{ steps.release_meta.outputs.tag }}" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "core ${{ steps.release_meta.outputs.tag }}" \
            --generate-notes \
            --latest
